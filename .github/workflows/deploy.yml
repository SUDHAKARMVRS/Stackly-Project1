name: Deploy Stackly Project

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::105906274181:role/GitHubActions-StacklyProject1
          aws-region: ap-south-1

      - name: Deploy files to S3
        run: |
          aws s3 sync . s3://stackly-project1-web-deployment \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E2VCH0M7YXHMN2 \
            --paths "/*"
